<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safar – Transport operations demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#EBEEF6; --line:#D9DEEA;
  --ink:#18203A; --ink-2:#52607F; --brand:#1E3A8A; --brand-ink:#FFFFFF;
  --accent:#F2A900; --good:#17804F; --good-bg:#E3F4EA; --bad:#B8392A; --bad-bg:#FBE7E3;
  --warn:#8A5A00; --warn-bg:#FFF2CC; --plate:#F7C600; --plate-ink:#141414;
  --shadow:0 1px 2px rgba(24,32,58,.06),0 4px 16px rgba(24,32,58,.06);
  --head:"Archivo",system-ui,sans-serif; --body:"Hind","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1528; --surface:#171F38; --surface-2:#1F2847; --line:#2C365A;
    --ink:#E8ECF7; --ink-2:#9AA6C6; --brand:#6F93F2; --brand-ink:#0F1528;
    --good:#5BCB92; --good-bg:#16352A; --bad:#F08A7B; --bad-bg:#3D1E1B;
    --warn:#F5C45A; --warn-bg:#3A2E10; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1528; --surface:#171F38; --surface-2:#1F2847; --line:#2C365A;
  --ink:#E8ECF7; --ink-2:#9AA6C6; --brand:#6F93F2; --brand-ink:#0F1528;
  --good:#5BCB92; --good-bg:#16352A; --bad:#F08A7B; --bad-bg:#3D1E1B;
  --warn:#F5C45A; --warn-bg:#3A2E10; --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--head);font-stretch:90%;margin:0;line-height:1.15}
h1{font-size:1.75rem;font-weight:750}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:650}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
img{max-width:100%}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--brand);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side{background:#131B33;border-right:1px solid var(--line)}}
:root[data-theme="dark"] .side{background:#131B33;border-right:1px solid var(--line)}
.logo{font-family:var(--head);font-weight:800;font-size:1.6rem;font-stretch:80%;letter-spacing:.01em;display:flex;align-items:center;gap:10px;margin:0 8px 24px}
.logo i{display:inline-block;width:14px;height:28px;background:var(--accent);border-radius:3px;transform:skewX(-14deg)}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.82);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff}
.nav a[aria-current="page"]::before{content:"";width:4px;height:18px;background:var(--accent);border-radius:2px;margin-left:-6px}
.nav svg{width:20px;height:20px;flex:none}
.side .foot{margin-top:auto;font-size:.85rem;color:rgba(255,255,255,.65);padding:0 8px}
.side .foot button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;margin-top:8px}

main{padding:28px clamp(16px,4vw,40px) 48px;max-width:1180px;width:100%}
.demo-note{display:inline-flex;gap:8px;align-items:center;font-size:.85rem;color:var(--warn);background:var(--warn-bg);padding:4px 10px;border-radius:999px;margin-bottom:14px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head p{margin:4px 0 0;color:var(--ink-2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 10px;font-size:.9rem}
.btn.ghost{background:none;border-color:transparent;color:var(--brand)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.panel>.ph{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);gap:12px}
.panel>.pb{padding:16px 18px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:20px;overflow:hidden}
.stat{padding:16px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--head);font-size:1.9rem;font-weight:750;font-stretch:85%;font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-2);font-size:.92rem}

.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list small{color:var(--ink-2);display:block}

.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.info{background:var(--surface-2);color:var(--ink-2)}

/* The number plate: yellow commercial plate */
.plate{display:inline-block;font-family:var(--head);font-stretch:75%;font-weight:750;font-size:.92rem;letter-spacing:.06em;background:var(--plate);color:var(--plate-ink);border:2px solid var(--plate-ink);border-radius:5px;padding:1px 7px;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.plate.big{font-size:1.25rem;padding:3px 12px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:.85rem;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--ink-2)}

.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:42px;background:var(--brand);border-radius:6px 6px 2px 2px}
.bar i.low{background:var(--bad)}
.bar span{font-size:.75rem;color:var(--ink-2);white-space:nowrap}

/* Trip pipeline */
.steps{display:flex;gap:4px;margin-top:6px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.steps i.on{background:var(--brand)}
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.trip{padding:16px 18px;cursor:pointer;text-align:left;width:100%}
.trip:hover{border-color:var(--ink-2)}
.route{font-family:var(--head);font-weight:700;font-size:1.1rem;font-stretch:88%;margin:10px 0 2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0}

.tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form .full{grid-column:1/-1}
label{display:block;font-size:.88rem;font-weight:600;color:var(--ink-2);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
textarea{min-height:110px;resize:vertical}
.filled{border-color:var(--good);background:var(--good-bg)}
.hint{font-size:.85rem;color:var(--ink-2);margin-top:4px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
.scrim.open{display:flex}
.modal{width:100%;max-width:720px;background:var(--surface);border-radius:16px;border:1px solid var(--line)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:12px}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;flex:none}

.money{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.money.total{border-bottom:0;font-weight:700;font-family:var(--head);font-size:1.1rem;padding-top:12px}
.callout{border-radius:12px;padding:12px 14px;margin-top:12px}
.callout.good{background:var(--good-bg);color:var(--good)}
.callout.bad{background:var(--bad-bg);color:var(--bad)}

.scan{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--ink-2)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.5s}}

.ms{list-style:none;margin:0 0 12px;padding:0}
.ms li{position:relative;padding:3px 0 10px 26px;color:var(--ink-2)}
.ms li::before{content:"";position:absolute;left:3px;top:9px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);z-index:1}
.ms li::after{content:"";position:absolute;left:8px;top:20px;bottom:-6px;width:2px;background:var(--line)}
.ms li:last-child::after{display:none}
.ms li.done{color:var(--ink)}
.ms li.done::before{background:var(--brand);border-color:var(--brand)}
.ms li.done::after{background:var(--brand)}
.ms li.now{color:var(--ink);font-weight:600}
.ms li.now::before{border-color:var(--accent);background:var(--accent)}
.wa{background:#DCF8C6;color:#111;border-radius:12px 12px 12px 4px;padding:12px 14px;white-space:pre-wrap;font-size:.95rem;max-width:460px}

/* Bilty */
.bilty{border:2px solid var(--ink);border-radius:6px;padding:16px;font-size:.92rem}
.bilty .top{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:10px;flex-wrap:wrap}
.bilty .co{font-family:var(--head);font-weight:800;font-size:1.3rem;font-stretch:80%}
.bilty .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.bilty .box{border:1px solid var(--line);border-radius:4px;padding:8px}
.bilty .box b{display:block;font-size:.78rem;color:var(--ink-2);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.bottom-nav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding-bottom:96px}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:40}
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:.72rem;color:var(--ink-2);text-decoration:none;font-weight:600}
  .bottom-nav a[aria-current="page"]{color:var(--brand)}
  .bottom-nav svg{width:22px;height:22px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .grid2{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .scrim{padding:0}
  .modal{border-radius:0;min-height:100%;border:0}
  .bilty .cols{grid-template-columns:1fr}
  .mobile-logo{display:flex !important}
}
.mobile-logo{display:none;font-family:var(--head);font-weight:800;font-size:1.3rem;font-stretch:80%;gap:8px;align-items:center;margin-bottom:10px;color:var(--brand)}
.mobile-logo i{display:inline-block;width:10px;height:20px;background:var(--accent);border-radius:2px;transform:skewX(-14deg)}
@media print{
  body *{visibility:hidden}
  .bilty,.bilty *{visibility:visible}
  .bilty{position:absolute;left:0;top:0;width:100%}
}
</style>
</head>

function saveIntl(){
 const c=cust(iv("i_cust")),wantTruck=$("#i_truck")&&$("#i_truck").checked;
 if(!c){toast("Choose a customer to create the job.");$("#i_cust").focus();return}
 const kind=iv("i_kind"),mode=iv("i_mode"),exp=kind==="Export",sea=mode!=="Air";
 const job=(exp?"EXP-":"IMP-")+(intlSeq++),party=iv("i_party")||"Not added",agent=iv("i_agent")||"Not added";
 const days=id=>Math.round((new Date(iv(id))-now)/DAY);
 const goods=(iv("i_goods")||"General cargo")+(iv("i_pkgs")?", "+iv("i_pkgs"):"");
 const cha={"Customs broker (CHA)":"Om Customs Brokers"};
 const parties=exp?{"Shipper":c.name+", "+c.city,"Consignee":party,"Overseas agent":agent,...cha}:{"Shipper":party,"Consignee":c.name+", "+c.city,"Overseas agent":agent,...cha};
 const ship=sea?{"Containers":mode==="Sea LCL"?"Shared container (LCL)":(iv("i_cont")||"Not added"),"Container no.":"Added after booking with the line","B/L no.":"Issued after sailing"}:{"MAWB no.":"Issued at booking"};
 ship[exp?"Shipping bill":"Bill of entry"]="Not filed yet";ship["HS code"]=iv("i_hs")||"Not added";ship["Goods"]=goods;
 if(exp)ship["Linked trucking"]="Not booked yet";
 const docs=["Commercial invoice","Packing list",exp?"Shipping bill":(sea?"Bill of lading":"Airway bill"),exp?(sea?"Bill of lading":"Airway bill"):"Bill of entry",exp?"Certificate of origin":"Delivery order"].map(x=>[x,0]);
 const cost=[[sea?"Ocean freight":"Air freight","USD",+iv("i_buy")||0,+iv("i_sell")||0],["CHA and customs","INR",9000,12000],[exp?"Trucking to port":"Delivery from port","INR",30000,36000]];
 if(mode==="Sea LCL")cost.push(["CFS charges","INR",8000,10000]);
 intl.unshift({job,kind,mode,cust:c.id,inco:iv("i_inco"),parties,pol:iv("i_pol"),pod:iv("i_pod"),etd:days("i_etd"),eta:days("i_eta"),ship,ms:exp?MS_EXP:MS_IMP,at:0,docs,cost});
 closeModal();location.hash="intl";render();
 if(wantTruck){truckFor(job);toast(`Job ${job} created. Now check the truck booking and save.`);return}
 toast(`Job ${job} created with its milestones, document checklist and standard charges.`);

let draftFrom="form",linkJob=null;
function bookingModal(tab){

 openModal(mh(linkJob?`Book truck for ${linkJob}`:"New booking")+`<div class="mb">
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${k===draftFrom}" data-act="btab" data-id="${k}">${l}</button>`).join("")}</div>

function bookingForm(){
 const opt=(arr,sel)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(l)}</option>`).join("");
 return `<div class="form">
  <div class="full"><label for="f_cust">Customer</label><select id="f_cust" data-act="custchange"><option value="">Choose customer</option>${opt(customers.map(c=>[c.id,c.name+", "+c.city]))}</select><div class="hint" id="custhint">Pick a saved customer and their GST, address and usual rate fill in.</div></div>
  <div><label for="f_from">From</label><select id="f_from" data-act="routechange">${opt(CITIES.map(c=>[c,c]))}</select></div>
  <div><label for="f_to">To</label><select id="f_to" data-act="routechange">${opt(CITIES.map(c=>[c,c]),"Pune")}</select></div>
  <div><label for="f_date">Loading date</label><input type="date" id="f_date" value="${iso(d(1))}"></div>
  <div><label for="f_trucks">Trucks</label><input id="f_trucks" type="number" min="1" value="1"></div>
  <div><label for="f_mat">Material</label><input id="f_mat" placeholder="e.g. Textile bales"></div>
  <div><label for="f_wt">Weight (ton)</label><input id="f_wt" type="number" min="1" placeholder="18"></div>
  <div><label for="f_rate">Freight per truck (₹)</label><input id="f_rate" type="number" placeholder="Fills from route"></div>
  <div><label for="f_cnee">Consignee</label><input id="f_cnee" placeholder="Who receives the goods"></div>
  <div><label for="f_addr">Delivery address</label><input id="f_addr" placeholder="Area, city"></div>
  <div><label for="f_pkgs">Packages</label><input id="f_pkgs" type="number" min="1" placeholder="120"></div>
  <div><label for="f_val">Goods value (₹)</label><input id="f_val" type="number" placeholder="From customer invoice"></div>
  <div><label for="f_cinv">Customer invoice no.</label><input id="f_cinv" placeholder="e.g. ST/1190"></div>
  <div><label for="f_ewb">E-way bill no.</label><input id="f_ewb" placeholder="12 digits"><div class="hint">In the live app, goods and consignee details fill in from this number.</div></div>
  <div><label for="f_veh">Truck</label><select id="f_veh">${opt(vehicles.filter(v=>!trips.some(t=>t.veh===v.no&&(t.status==="In transit"||t.status==="Loaded"))).map(v=>[v.no,v.no+" ("+v.driver+")"]))}</select><div class="hint">Only free trucks are shown.</div></div>
 </div>`;
}
function fill(id,val){const el=$("#"+id);if(!el||val==null||val==="")return;el.value=val;el.classList.add("filled")}
function routeFill(){
 const f=$("#f_from").value,t=$("#f_to").value,r=routes.find(x=>x.from===f&&x.to===t);
 if(r){fill("f_rate",r.rate)}
}
function custFill(){
 const c=cust($("#f_cust").value);if(!c)return;
 $("#f_cust").classList.add("filled");
 $("#custhint").textContent=`GSTIN ${c.gst}, phone ${c.phone}`;
 fill("f_from",c.city);fill("f_mat",c.material);routeFill();
}
function parseMsg(){
 const m=$("#wamsg").value,low=m.toLowerCase();
 const c=customers.find(x=>low.includes(x.name.toLowerCase())||low.includes(x.name.split(" ")[0].toLowerCase()));
 const found=CITIES.map(x=>({x,i:low.indexOf(x.toLowerCase())})).filter(o=>o.i>=0).sort((a,b)=>a.i-b.i).map(o=>o.x);
 const tons=(low.match(/(\d+(?:\.\d+)?)\s*(ton|tonne|t\b)/)||[])[1];
 const trucks=(low.match(/(\d+)\s*(truck|gaadi|gadi)/)||[])[1];
 const mats={kapda:"Textile bales",kapad:"Textile bales",tiles:"Ceramic tiles",pipe:"Steel pipes",dawai:"Medicines",anaj:"Food grains"};
 const mat=Object.keys(mats).find(k=>low.includes(k));
 if(c){$("#f_cust").value=c.id;custFill()}
 if(found[0])fill("f_from",found[0]);
 if(found[1])fill("f_to",found[1]);
 fill("f_date",iso(low.includes("aaj")?d(0):low.includes("parso")?d(2):d(1)));
 fill("f_trucks",trucks);fill("f_wt",tons);fill("f_mat",mat?mats[mat]:"");
 routeFill();
 toast("Booking filled from the message. Check the green fields and save.");
}
function repeatTrip(lr){
 const t=trips.find(x=>x.lr===lr);
 $("#f_cust").value=t.cust;custFill();fill("f_from",t.from);fill("f_to",t.to);fill("f_mat",t.material);fill("f_wt",t.weight);fill("f_rate",t.freight);fill("f_date",iso(d(1)));fill("f_cnee",t.cnee);fill("f_addr",t.cneeAddr);fill("f_pkgs",t.pkgs);
 toast("Copied from "+t.lr+". Only the date and truck need checking.");
}
function saveBooking(){
 const c=$("#f_cust").value,rate=+$("#f_rate").value,wt=+$("#f_wt").value;
 if(!c){toast("Choose a customer to save the booking.");$("#f_cust").focus();return}
 if(!rate){toast("Add the freight amount to save the booking.");$("#f_rate").focus();return}
 const n=Math.max(1,+$("#f_trucks").value||1),made=[],job=linkJob||("JOB-"+(jobSeq++)),cc=cust(c);
 for(let k=0;k<n;k++){
  const lr="LR-"+(lrSeq++);made.push(lr);
  trips.push({lr,cust:c,from:$("#f_from").value,to:$("#f_to").value,date:new Date($("#f_date").value),veh:$("#f_veh").value,material:$("#f_mat").value||"General goods",weight:wt||10,freight:rate,advance:0,status:"Booked",exp:[],job,inv:null,cnee:$("#f_cnee").value,cneeAddr:$("#f_addr").value||$("#f_to").value,pick:cc.city,pkgs:+$("#f_pkgs").value||0,pkgType:"packages",value:+$("#f_val").value||0,custInv:$("#f_cinv").value,ewb:$("#f_ewb").value});
 }
 if(linkJob){const j=intl.find(x=>x.job===linkJob);j.ship["Linked trucking"]=`${made.join(", ")} (${$("#f_from").value} to ${$("#f_to").value})`;linkJob=null;closeModal();location.hash="intl";render();intlModal(j.job);toast(`Truck booked. ${made.join(", ")} linked to ${j.job}.`);return}
 closeModal();location.hash="bookings";render();
 toast(`Booking ${job} saved. ${made.join(", ")} created.`);
}

// ---------- events ----------
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-act]");if(!el)return;
 const a=el.dataset.act,id=el.dataset.id;
 if(el.tagName==="SELECT")return;
 switch(a){
  case "close":closeModal();break;
  case "trip":tripModal(id);break;
  case "newbooking":e.preventDefault();linkJob=null;bookingModal("form");break;
  case "itruck":truckFor(id);break;
  case "btab":bookingModal(id);break;
  case "parse":parseMsg();break;
  case "repeat":repeatTrip(id);break;
  case "savebooking":saveBooking();break;
  case "scan":scanModal(id);break;
  case "doscan":doScan(id);break;
  case "saveexp":{const t=trips.find(x=>x.lr===id);t.exp.push({t:$("#sx_t").value,a:+$("#sx_a").value||0,n:$("#sx_n").value});render();tripModal(id);toast("Expense added. Settlement and profit updated.");break}
  case "advance":{const t=trips.find(x=>x.lr===id);t.status=STEPS[STEPS.indexOf(t.status)+1];render();tripModal(id);toast(`${t.lr} marked as ${t.status.toLowerCase()}.`+(t.status==="Delivered"?" Customer gets the POD on WhatsApp.":""));break}
  case "settle":{const t=trips.find(x=>x.lr===id);t.status="Settled";render();tripModal(id);toast(`Settled with ${veh(t.veh).driver}.`);break}
  case "mkinv":{const t=trips.find(x=>x.lr===id),no="INV-"+(invSeq++);t.inv=no;invoices.push({no,cust:t.cust,amt:t.freight,days:0,lrs:[t.lr],paid:false});render();tripModal(id);toast(`Invoice ${no} created for ${t.lr}.`);break}
  case "ijob":intlModal(id);break;
  case "newintl":intlForm();break;
  case "saveintl":saveIntl();break;
  case "ims":{const j=intl.find(x=>x.job===id);j.at++;render();intlModal(id);toast(`“${j.ms[j.at]}” done. Customer and overseas agent get the update on WhatsApp and email.`);break}
  case "idoc":{const j=intl.find(x=>x.job===id),x=j.docs[+el.dataset.k];x[1]=1;render();intlModal(id);toast(`${x[0]} uploaded to ${j.job}.`);break}
  case "iinv":{const j=intl.find(x=>x.job===id);toast(`Invoice ready for ${j.job}: dollar charges in USD, local charges in ₹ with GST.`);break}
  case "bilty":biltyModal(id);break;
  case "print":window.print();break;
  case "share":toast("In the real app this opens WhatsApp with the LR as a PDF.");break;
  case "remind":remindModal(id);break;
  case "sendremind":closeModal();toast("Reminder sent on WhatsApp.");break;
  case "bank":bankImport();break;
  case "applybank":["INV-325","INV-329"].forEach(n=>invoices.find(i=>i.no===n).paid=true);closeModal();render();toast("2 invoices marked paid.");break;
 }
});
document.addEventListener("change",e=>{
 if(e.target.id==="f_cust")custFill();
 if(e.target.id==="f_from"||e.target.id==="f_to")routeFill();
 if(e.target.id==="i_kind"||e.target.id==="i_mode")intlKind();
 if(e.target.id==="i_pol"||e.target.id==="i_pod")intlRate();
 if(e.target.id==="i_cust"){const c=cust(e.target.value);if(c){fill("i_goods",c.material);e.target.classList.add("filled")}}
});
document.addEventListener("input",e=>{if(e.target.id==="q")$("#brows").innerHTML=bookingRows(e.target.value)});
window.addEventListener("hashchange",render);

// theme toggle
$("#themeBtn").addEventListener("click",()=>{
 const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
 r.dataset.theme=dark?"light":"dark";
 try{localStorage.setItem("safar-theme",r.dataset.theme)}catch(_){}
});
try{const s=localStorage.getItem("safar-theme");if(s)document.documentElement.dataset.theme=s}catch(_){}

render();
})();
</script>
